{% extends 'components/layouts/auth.html' %}
{% load static %}

{% block content %}

<div class="flex min-h-screen">
    <div class="bg-gradient-to-t from-[#ff1361bf] to-[#44107A] w-1/2  min-h-screen hidden lg:flex flex-col items-center justify-center text-white dark:text-black p-4">
        <div class="w-full mx-auto mb-5"><img src="{% static 'assets/images/logo2.png' %}" alt="coming_soon" class="lg:max-w-[370px] xl:max-w-[500px] mx-auto" /></div>
        <h3 class="text-3xl font-bold mb-4 text-center">Face Recognition Attendance System</h3>
        
    </div>
    <div class="w-full lg:w-1/2 relative flex justify-center items-center">
        <div class="max-w-[480px] p-5 md:p-10">
            <h2 class="font-bold text-3xl mb-3">Sign In</h2>
            <p class="mb-7">Enter your email and password to login</p>
            <form class="space-y-5"  action="" method="post">
                 {% csrf_token %}
                <div>
                    <label for="Username">Username</label>
                    <input name="username" id="username" type="username" class="form-input" placeholder="Enter Email" />
                </div>
                <div>
                    <label for="password">Password</label>
                    <input name="password" id="password" type="password" class="form-input" placeholder="Enter Password" />
                </div>
                <div>
                    <label class="cursor-pointer">
                        <input type="checkbox" class="form-checkbox" />
                        <span class="text-white-dark">Remember me</span>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary w-full">SIGN IN</button>
            </form>
            <div class="relative my-7 h-5 text-center before:w-full before:h-[1px] before:absolute before:inset-0 before:m-auto before:bg-[#ebedf2]  dark:before:bg-[#253b5c]">
                <div class="font-bold text-white-dark bg-[#fafafa] dark:bg-[#060818] px-2 relative z-[1] inline-block">
                  
                </div>
            </div>
            <p class="text-center">Dont't have an account ? <a href="/register" class="text-primary font-bold hover:underline">Sign Up</a></p>
        </div>
    </div>
</div>

{% endblock %}
